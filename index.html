<style>
/* Layout: full-screen 3D arena; HUD pinned to the edges, menus as centred panels over the dimmed arena. One committed night look. */
:root{
  color-scheme:dark;
  --night:#10121c; --panel:#1a1d2e; --panel2:#232740; --line:#3a4064;
  --ink:#ece8dc; --dim:#9ea2bd;
  --soul:#5cf2d6; --ember:#ffb347; --blood:#ff5a5f; --rare:#5ab8ff; --epic:#c58bff; --gold:#ffd76a;
  --display:'Russo One','Arial Black',Impact,sans-serif;
  --body:'Rubik','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#game{position:fixed;inset:0;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,50,.55) 100%)}
#vig.on{opacity:1;transition:none}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#xpbar{position:absolute;left:0;right:0;top:0;height:16px;background:#0b0d16;border-bottom:1px solid var(--line)}
#xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1fae9a,var(--soul));box-shadow:0 0 12px var(--soul)}
#xpbar b{position:absolute;left:50%;top:0;transform:translateX(-50%);font:11px/16px var(--display);letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px #000}
#topl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:28px;display:flex;flex-direction:column;gap:6px}
#hpbar{position:relative;width:230px;max-width:46vw;height:20px;background:#0b0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
#hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c2313a,var(--blood))}
#hpbar b{position:absolute;inset:0;text-align:center;font:500 12px/19px var(--body);text-shadow:0 1px 2px #000}
#counts{display:flex;gap:14px;font:500 14px var(--body);text-shadow:0 1px 3px #000}
#counts span b{font-weight:700}
#timer{position:absolute;left:50%;top:26px;transform:translateX(-50%);font:30px var(--display);letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.6)}
#topr{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:28px;display:flex;gap:8px;pointer-events:auto}
.ibtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(20,22,36,.8);color:var(--ink);font-size:17px;cursor:pointer}
.ibtn:hover{background:var(--panel2)}
#botl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#sets,#pas{display:flex;gap:6px;flex-wrap:wrap;max-width:min(420px,80vw)}
.set{font:500 11px var(--body);padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(16,18,28,.8);color:var(--dim)}
.set.on{color:#10121c;background:var(--tc);border-color:var(--tc);font-weight:700}
.pas{font-size:13px;background:rgba(16,18,28,.75);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.pas b{font:500 11px var(--body);margin-left:3px;color:var(--dim)}
#slots{display:flex;gap:6px}
.slot{position:relative;width:48px;height:48px;border-radius:9px;border:2px solid var(--tc,var(--line));background:rgba(16,18,28,.82);display:grid;place-items:center}
.slot.empty{border-style:dashed;border-color:#2b3050;background:rgba(16,18,28,.4)}
.slot .ic{font-size:24px;line-height:1}
.slot .lv{position:absolute;right:-5px;bottom:-6px;font:10px var(--display);background:var(--tc);color:#10121c;border-radius:5px;padding:1px 4px}
.slot.super{box-shadow:0 0 14px var(--gold);border-color:var(--gold)}
.slot.super .lv{background:var(--gold)}
#dash{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:150px;height:22px;border-radius:99px;border:1px solid var(--line);background:rgba(16,18,28,.8);overflow:hidden}
#dash i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#3a5cff,#7fd0ff)}
#dash b{position:absolute;inset:0;text-align:center;font:500 11px/21px var(--body);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 2px #000}
#buffs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:18px;display:flex;gap:6px}
.buff{font:500 13px var(--body);padding:4px 9px;border-radius:8px;background:rgba(16,18,28,.85);border:1px solid var(--ember);color:var(--ember)}
#toasts{position:absolute;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font:17px var(--display);letter-spacing:.04em;padding:7px 18px;border-radius:8px;background:rgba(12,13,22,.88);border:1px solid var(--line);text-shadow:0 1px 2px #000;animation:toast 2.6s forwards}
.toast.big{font-size:26px;color:var(--gold);border-color:var(--gold);box-shadow:0 0 30px rgba(255,215,106,.35)}
.toast.bad{color:var(--blood);border-color:var(--blood)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px) scale(.92)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* Screens */
.screen{position:absolute;inset:0;overflow:auto;background:rgba(8,9,16,.74);backdrop-filter:blur(3px);
  display:flex;justify-content:center;align-items:flex-start;padding-block:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none}
.wrap{width:100%;max-width:980px;margin:auto 0;display:flex;flex-direction:column;gap:18px}
h1{font:clamp(34px,7vw,64px)/1 var(--display);margin:0;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 34px rgba(92,242,214,.35),0 3px 0 #000;text-wrap:balance}
h2{font:17px var(--display);margin:0 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sub{margin:8px 0 0;color:var(--dim);max-width:62ch;line-height:1.45}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols>section{min-width:0;background:rgba(26,29,46,.92);border:1px solid var(--line);border-radius:12px;padding:16px}
.coins{color:var(--gold);font:16px var(--display);letter-spacing:0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:9px;border:2px solid transparent;background:var(--panel2);color:var(--ink);font:500 11px var(--body);cursor:pointer;min-width:0}
.wbtn .ic{font-size:24px}
.wbtn .tg{width:22px;height:3px;border-radius:2px;background:var(--tc)}
.wbtn:hover{border-color:var(--line)}
.wbtn.sel{border-color:var(--soul);background:#1d3340}
.wdesc{margin-top:10px;color:var(--dim);font-size:13px;line-height:1.4;min-height:3.9em}
.wdesc b{color:var(--ink)}
.panel{background:rgba(26,29,46,.92);border:1px solid var(--line);border-radius:12px;padding:16px}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:900px){.hgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.hgrid{grid-template-columns:repeat(3,1fr);gap:6px}.hbtn{padding:6px 4px 8px}.hbtn img{width:64px;height:82px}.hbtn .hn{font-size:13px}.hbtn .hd{font-size:10.5px}}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 8px 10px;border-radius:10px;border:2px solid transparent;background:var(--panel2);color:var(--ink);font-family:var(--body);cursor:pointer;min-width:0;text-align:center}
.hbtn img{width:96px;height:122px;object-fit:contain}
.hbtn .hn{font:15px var(--display)}
.hbtn .hd{font-size:11.5px;line-height:1.35;color:var(--dim)}
.hbtn:hover:not(:disabled){border-color:var(--line)}
.hbtn.sel{border-color:var(--soul);background:#1d3340}
.hbtn.locked{cursor:default}
.hbtn.locked img{filter:brightness(.25) saturate(0)}
.link{font:500 12px var(--body);letter-spacing:0;text-transform:none;background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;padding:0}
.link:hover{color:var(--ink)}
.meta{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2)}
.mrow .nm{font-weight:500;font-size:13px}
.mrow .ds{color:var(--dim);font-size:12px}
.mrow button{font:500 12px var(--body);padding:6px 10px;border-radius:7px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;white-space:nowrap}
.mrow button:hover:not(:disabled){background:var(--gold);color:#10121c}
.mrow button:disabled{border-color:var(--line);color:var(--dim);cursor:default}
.cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font:22px var(--display);letter-spacing:.05em;padding:14px 34px;border-radius:12px;border:0;background:var(--soul);color:#08221d;cursor:pointer;box-shadow:0 6px 0 #1a8f7d,0 0 30px rgba(92,242,214,.35)}
.big:hover{filter:brightness(1.08)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #1a8f7d}
.btn{font:500 14px var(--body);padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--soul)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
.rec,.keys{color:var(--dim);font-size:13px;line-height:1.5}
.keys{margin:0}
kbd{font:500 11px var(--body);padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}

/* Level-up cards */
.lvhead{text-align:center}
.lvhead h1{font-size:clamp(28px,5vw,44px);color:var(--soul)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:14px;border:2px solid var(--rc,var(--line));background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);cursor:pointer;min-width:0;font-family:var(--body);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--rc,#fff) 35%,transparent)}
.card .kind{font:500 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--rc,var(--dim))}
.card .top{display:flex;gap:12px;align-items:center}
.card .ic{font-size:40px;line-height:1}
.card .nm{font:20px var(--display);text-wrap:balance}
.card .tx{font-size:14px;line-height:1.4}
.card .hint{font-size:12px;color:var(--dim);line-height:1.4;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.card .hint.hot{color:var(--gold)}
.card .key{position:absolute;right:12px;top:12px}
.chip{display:inline-block;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--tc);color:#10121c;margin-right:4px}
.card.fuse{--rc:var(--gold);background:linear-gradient(180deg,#4a3b12,#231c0c);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 34px rgba(255,215,106,.55)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Pause / results */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>section{min-width:0;background:rgba(26,29,46,.92);border:1px solid var(--line);border-radius:12px;padding:16px}
.li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid rgba(58,64,100,.5);font-size:13px;line-height:1.4}
.li:last-child{border-bottom:0}
.li .a{flex:1;min-width:0}
.li .d{color:var(--dim)}
.li.ok .a{color:var(--gold)}
.li.off{opacity:.55}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font:28px var(--display);color:var(--ink)}
.stat span{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bar{position:relative;height:22px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:5px 0;font-size:12px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#27607a,#3aa6c9)}
.bar span{position:absolute;left:8px;top:0;line-height:22px;text-shadow:0 1px 2px #000}
.bar em{position:absolute;right:8px;top:0;line-height:22px;font-style:normal;color:var(--ink);text-shadow:0 1px 2px #000}
@media (max-width:760px){
  .cols,.grid2{grid-template-columns:1fr}
  #timer{font-size:22px;top:30px}
  #hpbar{max-width:33vw}
  .slot{width:40px;height:40px}.slot .ic{font-size:19px}
  #dash{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.card.fuse{animation-duration:.01s}}

/* Phones and tablets: notch-safe HUD, an on-screen dash button, touch hints instead of keys */
body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.screen{touch-action:pan-y;overscroll-behavior:contain}
/* In-app browsers (Telegram) close their sheet on a swipe when the page sits at its top or left edge.
   html.lock makes the page a little larger than the screen and keeps it scrolled away from the edges;
   the game itself is position:fixed, so nothing visible moves. */
html.lock{overflow:scroll;overscroll-behavior:none;scrollbar-width:none}
html.lock::-webkit-scrollbar{display:none}
html.lock body{height:calc(100% + 120px)}
html.lock.lockx body{width:calc(100% + 120px)}
.tghint{display:none;margin:0;padding:10px 12px;border-radius:10px;border:1px solid var(--ember);background:rgba(255,179,71,.1);color:var(--ink);font-size:13px;line-height:1.45}
html.tg .tghint{display:block}
#xpbar{top:env(safe-area-inset-top,0px)}
#topl,#topr{top:calc(28px + env(safe-area-inset-top,0px))}
#timer{top:calc(26px + env(safe-area-inset-top,0px))}
#botl{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tc{display:none}
#dashBtn{display:none;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  width:74px;height:74px;border-radius:50%;border:2px solid #7fd0ff;pointer-events:auto;touch-action:none;
  background:conic-gradient(rgba(127,208,255,.38) calc(var(--cd,1)*360deg),rgba(16,18,28,.78) 0);
  color:#fff;font:12px var(--display);letter-spacing:.04em;text-shadow:0 1px 2px #000;box-shadow:0 0 18px rgba(127,208,255,.3)}
#dashBtn.ready{background:rgba(58,92,255,.55);box-shadow:0 0 22px rgba(127,208,255,.7)}
#dashBtn:active{transform:scale(.94)}
body.touch #dashBtn{display:block}
body.touch #dash,body.touch kbd,body.touch .kb{display:none}
body.touch .tc{display:inline}
body.touch #buffs{bottom:auto;top:calc(76px + env(safe-area-inset-top,0px))}
body.touch #sets,body.touch #pas{max-width:calc(100vw - 130px)}
body.touch .card:hover{transform:none}
/* phones: the start button stays pinned to the bottom of the menu while it scrolls */
@media (max-width:760px){
  .cta{position:sticky;bottom:-28px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(8,9,16,0),rgba(8,9,16,.92) 30%);z-index:2}
  .cta .rec{font-size:12px}
}
@media (max-width:420px){
  .slot{width:36px;height:36px}.slot .ic{font-size:17px}#slots{gap:5px}
  #timer{font-size:20px}
  .card{padding:14px}.card .ic{font-size:32px}.card .nm{font-size:18px}
  .big{font-size:19px;padding:12px 26px}
}
</style>

<div id="game">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="vig"></div><div id="flash"></div>
  <div id="hud" hidden>
    <div id="xpbar"><i></i><b id="lvl">УР. 1</b></div>
    <div id="topl">
      <div id="hpbar"><i></i><b></b></div>
      <div id="counts"><span title="Убито">💀 <b id="kills">0</b></span><span title="Монеты за забег">🪙 <b id="gold">0</b></span></div>
    </div>
    <div id="timer">00:00</div>
    <div id="topr"><button class="ibtn" id="muteBtn" title="Звук (M)">🔊</button><button class="ibtn" id="pauseBtn" title="Пауза (Esc)">⏸</button></div>
    <div id="toasts"></div>
    <div id="botl"><div id="pas"></div><div id="sets"></div><div id="slots"></div></div>
    <div id="dash"><i></i><b>Рывок · пробел</b></div>
    <button id="dashBtn" aria-label="Рывок">РЫВОК</button>
    <div id="buffs"></div>
  </div>
  <div id="screen" class="screen" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async()=>{
'use strict';
const $=s=>document.querySelector(s);
const scr=$('#screen'), hud=$('#hud');
if(!window.THREE){scr.hidden=false;scr.innerHTML='<div class="wrap"><h1>Ночная жатва</h1><p class="sub">Не загрузилась 3D-библиотека. Проверьте интернет и обновите страницу.</p></div>';return;}

// Models made in Blender (blender/build_models.py -> export_models.py -> models.json). Without the file the game
// falls back to the shapes built in code below.
let MODELS=null;
try{const r=await Promise.race([fetch('models.json'),new Promise(res=>setTimeout(()=>res(null),6000))]);if(r&&r.ok)MODELS=(await r.json()).models;}catch(e){MODELS=null;}

// ---------- helpers ----------
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const fmtTime=t=>{t=Math.floor(t);return String((t/60)|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};
const fmtNum=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(Math.round(n));

// ---------- save ----------
const SAVE_KEY='night-harvest-v1';
const save={coins:0,meta:{},best:{time:0,kills:0,lvl:0},startWeapon:'cleaver',hero:'digger',unlocked:{},mute:false,runs:0};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)Object.assign(save,s);}catch(e){}
if(!save.meta||typeof save.meta!=='object')save.meta={};
if(!save.best||typeof save.best!=='object')save.best={time:0,kills:0,lvl:0};

let AC=null,master=null,noiseBuf=null;const slast={};
function audioInit(){

  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.3;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,slide,delay){
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);

  const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}

const IN_TG=/Telegram/i.test(navigator.userAgent)||!!(window.TelegramWebview||window.TelegramWebviewProxy||window.TelegramWebviewProxyProto)||/[?&]tg\b/.test(location.search);

function lockScroll(){
  if(locked||!TOUCH_ON())return;locked=true;
  const de=document.documentElement;de.classList.add('lock');if(IN_TG)de.classList.add('lockx');
  const fix=()=>{const x=IN_TG?LOCK_OFF:0;if(Math.abs(scrollY-LOCK_OFF)>.5||Math.abs(scrollX-x)>.5)scrollTo(x,LOCK_OFF);};
  fix();requestAnimationFrame(fix);setTimeout(fix,300);
  addEventListener('scroll',fix,{passive:true});addEventListener('resize',()=>setTimeout(fix,50));
  addEventListener('touchstart',fix,{passive:true});
  // the page itself never scrolls by finger; only a menu that is taller than the screen does
  document.addEventListener('touchmove',e=>{const sc=e.target.closest&&e.target.closest('.screen');
    if(!sc||sc.scrollHeight<=sc.clientHeight+1)e.preventDefault();},{passive:false});
}

const CELL=3;let grid=new Map();
const gkey=(cx,cz)=>cx*100003+cz;

function forNear(x,z,r,fn){
  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),z0=Math.floor((z-r)/CELL),z1=Math.floor((z+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cz=z0;cz<=z1;cz++){const a=grid.get(gkey(cx,cz));if(!a)continue;for(let i=0;i<a.length;i++){const e=a[i];if(!e.dead)fn(e);}}
}
function nearest(x,z,maxR,skip){let best=null,bd=maxR*maxR;for(const e of enemies){if(e.dead||(skip&&skip.has(e.id)))continue;const dx=e.x-x,dz=e.z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=e;}}return best;}
function within(x,z,r){const out=[],r2=r*r;for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dz=e.z-z;if(dx*dx+dz*dz<r2)out.push(e);}return out;}

// ---------- effects ----------

function ringFx(x,z,r0,r1,dur,color,op){const m=new THREE.Mesh(RING_GEO,fxMat(color,op||.85,true));m.position.set(x,.12,z);scene.add(m);fxs.push({m,t:0,dur,r0,r1,op:op||.85});}
function slashFx(x,z,ang,R,arc,color){const m=new THREE.Mesh(arcGeo(Math.min(arc,TAU)),fxMat(color,.75,true));m.position.set(x,.9,z);m.rotation.y=ang-Math.PI/2;scene.add(m);fxs.push({m,t:0,dur:.18,r0:R*.8,r1:R,op:.75});}
function lightning(x1,z1,x2,z2){
  let px=x1,pz=z1;const n=3;
  for(let i=1;i<=n;i++){const k=i/n;let nx=x1+(x2-x1)*k,nzz=z1+(z2-z1)*k;if(i<n){nx+=rnd(-.5,.5);nzz+=rnd(-.5,.5);}
    const dx=nx-px,dz=nzz-pz;bolts.push({x:(px+nx)/2,y:1.2,z:(pz+nzz)/2,yaw:Math.atan2(dx,dz),sx:.14,sy:.14,sz:Math.hypot(dx,dz),life:.14,max:.14,r:.75,g:.95,b:1});px=nx;pz=nzz;}
}
function skyBolt(x,z){bolts.push({x:x+rnd(-.2,.2),y:8,z,yaw:0,sx:.3,sy:16,sz:.3,life:.16,max:.16,r:1,g:.97,b:.7});}
function toast(text,cls){const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=text;const box=$('#toasts');box.appendChild(d);while(box.children.length>3)box.removeChild(box.firstChild);setTimeout(()=>d.remove(),2600);}
function screenFlash(a){G.flash=Math.max(G.flash,a);}

// ---------- combat ----------
// bosses cannot be stunned; everyone else shrugs off new stuns for a moment after one ends, so nothing can be locked forever
function stun(e,d){if(e.boss||G.t<e.stunImm)return;e.stunT=d;e.stunImm=G.t+d+2.5;}
function hurt(e,dmg,nx,nz,kb,w,dot){
  if(e.dead)return;
  const crit=!dot&&Math.random()<S.crit;if(crit)dmg*=2;
  e.hp-=dmg;e.flash=.1;if(w)G.log[w.id]=(G.log[w.id]||0)+dmg;
  if(S.ignite&&!dot&&w){e.burnT=2.5;e.burnDps=Math.max(e.burnDps,S.ignite*S.dmg);if(!e.burnW)e.burnW=w;}
  if(kb&&!e.boss){const k=kb/e.mass;e.kx+=nx*k;e.kz+=nz*k;}
  if(nums.length<110)nums.push({x:e.x+rnd(-.3,.3),z:e.z,y:1.5*e.s+.3,v:Math.max(1,Math.round(dmg)),t:0,crit,dot});
  if(e.hp<=0)kill(e);else sfx('hit');
}
function kill(e){
  e.dead=true;G.kills++;sfx('kill');
  burst(e.x,1*e.s,e.z,e.elite||e.boss?26:6,KCOL[e.type],e.elite?9:5,e.elite?.26:.16);
  dropSoul(e.x,e.z,e.xp);
  if(S.leech){P.leechN++;if(P.leechN>=S.leech){P.leechN=0;P.hp=Math.min(S.maxHp,P.hp+1);}}
  if(e.elite||e.boss){
    spawnChest(e.x,e.z);const n=e.boss?20:5;for(let i=0;i<n;i++)dropCoin(e.x+rnd(-1.5,1.5),e.z+rnd(-1.5,1.5),e.boss?2:1);
    ringFx(e.x,e.z,.5,e.boss?9:5,.5,0xffd76a);G.shake=Math.max(G.shake,.5);
    if(e.boss){toast('Босс повержен','big');sfx('chest');}
  }else{
    const r=Math.random();
    if(r<0.02)dropCoin(e.x,e.z,1);if(G.t>=G.nextPick){G.nextPick=G.t+rnd(14,22);dropPickup(e.x,e.z);}
    
  }
}
function dropSoul(x,z,v){
  if(souls.length>=950){const s=souls[(Math.random()*souls.length)|0];s.v+=v;return;}
  const a=rnd(0,TAU);souls.push({x,z,v,vx:Math.sin(a)*3,vz:Math.cos(a)*3,pull:false,ph:rnd(0,TAU)});
}
function dropCoin(x,z,v){if(coins.length<280){const a=rnd(0,TAU);coins.push({x,z,v,vx:Math.sin(a)*4,vz:Math.cos(a)*4,pull:false,ph:rnd(0,TAU)});}else coins[0].v+=v;}
const PICK={heal:'❤️',magnet:'🧲',bomb:'💣',rage:'⚡',freeze:'❄️'};
function dropPickup(x,z,kind){
  if(pickups.length>=10)return;kind=kind||pick(['heal','heal','magnet','magnet','bomb','rage','freeze']);
  const s=emojiSprite(PICK[kind]);s.position.set(x,1.1,z);scene.add(s);pickups.push({x,z,kind,s,ph:rnd(0,TAU)});
}
function spawnChest(x,z){const m=new THREE.Mesh(chestGeo,chestMat);m.castShadow=true;m.position.set(x,0,z);scene.add(m);chests.push({x,z,m,t:0});toast('Элита оставила сундук');}
function damagePlayer(d,src){
  if(P.inv>0||P.dashT>0||G.state!=='play')return;
  d=Math.max(1,d*G.dmgMul-S.armor);P.hp-=d;G.hurtTotal+=d;G.hurtBy[src]=(G.hurtBy[src]||0)+d;P.inv=.4;G.shake=Math.max(G.shake,.4);sfx('hurt');
  const v=$('#vig');v.classList.add('on');setTimeout(()=>v.classList.remove('on'),60);
  if(P.hp<=0){
    if(P.revives>0){P.revives--;P.hp=S.maxHp*.5;P.inv=2.5;toast('Второе дыхание!','big');sfx('fuse');screenFlash(.7);
      ringFx(P.x,P.z,1,14,.6,0xffffff);for(const e of within(P.x,P.z,14))hurt(e,e.boss||e.elite?e.maxHp*.2:e.hp+1,0,0,0,null,1);}
    else endRun(true);
  }
}
function addXp(v){
  P.xp+=v*S.xp;let up=false;
  while(P.xp>=P.need){P.xp-=P.need;P.lvl++;P.need=needFor(P.lvl);G.pendingLv++;up=true;}
  if(up&&G.state==='play')openLevelUp();
}

// ---------- weapons ----------
const SPIN={orbit:1,aura:1,nova:1,storm:1,minion:1,turret:1,mine:1,beam:1};
const wDmg=w=>{let m=1;for(const t of w.def.tags){const k=S.tagDmg[t];if(k>m)m=k;}return w.st.dmg*S.dmg*m;};
const wCd=w=>w.st.cd/S.atkSpd/(G.rage>0?1.6:1);
function swing(w,ang){
  const st=w.st,R=st.range*S.area,half=st.arc/2,full=st.arc>=TAU-.01,dmg=wDmg(w);
  forNear(P.x,P.z,R+1.4,e=>{const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz)||.001;
    if(d<R+e.r&&(full||Math.abs(angDiff(Math.atan2(dx,dz),ang))<half))hurt(e,dmg,dx/d,dz/d,st.kb,w);});
  if(st.quiet){if(Math.random()<.5)burst(P.x+Math.sin(ang)*R*.7,1,P.z+Math.cos(ang)*R*.7,1,st.col,4,.1);}
  else{slashFx(P.x,P.z,ang,R,st.arc,st.col);sfx('slash');}
}
function strongest(x,z,r){let best=null,bh=0;const r2=r*r;for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dz=e.z-z;if(dx*dx+dz*dz<r2&&e.hp>bh){bh=e.hp;best=e;}}return best;}
function shoot(w,x,z,a,dmg){
  const st=w.st,c=rgb(st.col);
  projs.push({kind:'gun',x,z,a,vx:Math.sin(a)*st.speed,vz:Math.cos(a)*st.speed,life:st.life||.5,dmg,pierce:(st.pierce||0)+S.pierce,r:st.wid+.15,len:st.len,wid:st.wid,kb:st.kb,burn:st.burn||0,chill:st.chill||0,stun:st.stun||0,w,hit:null,cr:c[0],cg:c[1],cb:c[2]});
}
function launch(w,x,z,a,dmg){
  const st=w.st,c=rgb(st.col);
  projs.push({kind:'homing',x,z,a,speed:st.speed,turn:st.turn,life:st.life||3,dmg,radius:(st.radius||0)*S.area,pierce:st.pierce||0,kb:st.kb,w,hit:null,target:null,seek:0,knife:st.knife,cr:c[0],cg:c[1],cb:c[2]});
}
function explode(x,z,R,dmg,kb,w){
  forNear(x,z,R+1.4,e=>{const dx=e.x-x,dz=e.z-z,d=Math.hypot(dx,dz)||.001;if(d<R+e.r)hurt(e,dmg,dx/d,dz/d,kb,w);});
  ringFx(x,z,.3,R,.28,0xffb347);burst(x,.6,z,10,0xff8a2a,7,.2);sfx('blast');G.shake=Math.max(G.shake,.12);
}
function fireGun(w,base){
  const st=w.st,n=st.count+S.proj,dmg=wDmg(w),spread=n>1?Math.max(st.spread,.1*(n-1)):0;w.aim=base;
  for(let i=0;i<n;i++)shoot(w,w.wx,w.wz,base+(n>1?(i/(n-1)-.5)*spread:0)+rnd(-st.jit,st.jit),dmg);
  sfx(st.snd);
}
function updateWeapons(dt){
  const n=P.weapons.length;
  for(let i=0;i<n;i++){
    const w=P.weapons[i],st=w.st,a=i/n*TAU+G.t*.5;
    w.wx=P.x+Math.sin(a)*1.9;w.wz=P.z+Math.cos(a)*1.9;w.cd-=dt;
    switch(w.def.type){
      case 'melee':{
        if(w.pending){w.pending.t-=dt;if(w.pending.t<=0){swing(w,w.pending.ang);w.pending=null;}}
        if(w.cd<=0){const t=nearest(P.x,P.z,st.range*S.area+.6);if(t){w.cd=wCd(w);const ang=Math.atan2(t.x-P.x,t.z-P.z);w.aim=ang;swing(w,ang);if(st.double)w.pending={t:.16,ang:ang+Math.PI};}else w.cd=.05;}
        break;}
      case 'gun':{
        if(w.cd<=0){
          if(st.face){if(nearest(P.x,P.z,24)){w.cd=wCd(w);fireGun(w,Math.atan2(P.dvx,P.dvz));}else w.cd=.1;}
          else{const t=st.strong?strongest(P.x,P.z,st.range):nearest(P.x,P.z,st.range);if(t){w.cd=wCd(w);fireGun(w,Math.atan2(t.x-w.wx,t.z-w.wz));}else w.cd=.05;}
        }
        break;}
      case 'homing':{
        if(w.cd<=0){const t=nearest(P.x,P.z,st.range);if(t){w.cd=wCd(w);const base=Math.atan2(t.x-P.x,t.z-P.z),k=st.count+S.proj,dmg=wDmg(w);w.aim=base;
          for(let j=0;j<k;j++)launch(w,w.wx,w.wz,base+rnd(-1.1,1.1),dmg);sfx(st.knife?'slash':'whoosh');}else w.cd=.1;}
        break;}
      case 'minion':{
        while(w.minions.length<st.count)w.minions.push({x:P.x+rnd(-2,2),z:P.z+rnd(-2,2),cd:0,seek:0,t:null,a:w.minions.length*2.1,yaw:0});
        const taken=new Set(),dmg=wDmg(w),R=st.radius*S.area;
        for(const g of w.minions){
          g.cd-=dt;g.seek-=dt;
          if(g.seek<=0||!g.t||g.t.dead){g.seek=.2;g.t=nearest(g.x,g.z,13,taken);if(g.t&&Math.hypot(g.t.x-P.x,g.t.z-P.z)>17)g.t=null;}
          if(g.t)taken.add(g.t.id);
          let tx,tz,stop;
          if(g.t){tx=g.t.x;tz=g.t.z;stop=g.t.r+.9;}else{tx=P.x+Math.sin(G.t*1.3+g.a)*2.6;tz=P.z+Math.cos(G.t*1.3+g.a)*2.6;stop=.2;}
          const dx=tx-g.x,dz=tz-g.z,d=Math.hypot(dx,dz)||.001;
          if(d>stop){const sp=Math.min(st.speed*(d>20?4:1),d/dt);g.x+=dx/d*sp*dt;g.z+=dz/d*sp*dt;g.yaw=Math.atan2(dx,dz);}
          else if(g.t&&g.cd<=0){g.cd=wCd(w);const gx=g.x,gz=g.z;
            forNear(gx,gz,R+1.4,e=>{const ex=e.x-gx,ez=e.z-gz,ed=Math.hypot(ex,ez)||.001;if(ed<R+e.r)hurt(e,dmg,ex/ed,ez/ed,st.kb,w);});
            ringFx(gx,gz,.3,R,.2,0xbfeaff,.6);}
        }
        break;}
      case 'turret':{
        if(w.cd<=0){w.cd=wCd(w);if(w.turrets.length>=st.max)w.turrets.shift();w.turrets.push({x:P.x+rnd(-.8,.8),z:P.z+rnd(-.8,.8),life:st.dur,cd:.3,yaw:P.yaw});burst(P.x,.5,P.z,8,0x9dff8a,4,.14);sfx('pick');}
        const dmg=wDmg(w);
        for(const u of w.turrets){u.life-=dt;u.cd-=dt;
          if(u.cd<=0){const t=nearest(u.x,u.z,st.range);
            if(t){u.cd=st.rate/S.atkSpd/(G.rage>0?1.6:1);u.yaw=Math.atan2(t.x-u.x,t.z-u.z);if(st.rocket)launch(w,u.x,u.z,u.yaw+rnd(-.5,.5),dmg);else shoot(w,u.x,u.z,u.yaw,dmg);sfx(st.rocket?'whoosh':'nail');}
            else u.cd=.15;}
          if(u.life<=0)burst(u.x,.5,u.z,6,0x77808f,4,.14);}
        w.turrets=w.turrets.filter(u=>u.life>0);
        break;}
      case 'mine':{
        if(w.cd<=0){w.cd=wCd(w);if(w.mines.length<st.max+S.proj*2)w.mines.push({x:P.x+rnd(-.4,.4),z:P.z+rnd(-.4,.4),arm:.5});}
        const R=st.radius*S.area;
        for(const m of w.mines){m.arm-=dt;if(m.arm>0)continue;
          if(Math.hypot(m.x-P.x,m.z-P.z)>45){m.dead=true;continue;}
          let hit=false;forNear(m.x,m.z,2.6,e=>{if(!hit&&Math.hypot(e.x-m.x,e.z-m.z)<e.r+1.1)hit=true;});
          if(hit){m.dead=true;explode(m.x,m.z,R,wDmg(w),st.kb,w);}}
        w.mines=w.mines.filter(m=>!m.dead);
        break;}
      case 'beam':{
        w.ang+=st.speed*dt;w.tickT-=dt;
        if(w.tickT<=0){w.tickT=st.tick/S.atkSpd;const L=st.len*Math.sqrt(S.area),dmg=wDmg(w);
          for(let j=0;j<st.count;j++){const ba=w.ang+j*TAU/st.count,bx=Math.sin(ba),bz=Math.cos(ba);
            for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dz=e.z-P.z,along=dx*bx+dz*bz;if(along<0||along>L+e.r)continue;
              if(Math.abs(dx*bz-dz*bx)<st.wid+e.r){if(st.burn){e.burnT=2.5;e.burnDps=st.burn*S.dmg;e.burnW=w;}hurt(e,dmg,0,0,0,w,1);}}}}
        break;}
      case 'boom':{
        if(w.cd<=0){const t=nearest(P.x,P.z,st.range*1.3);if(t){w.cd=wCd(w);const base=Math.atan2(t.x-P.x,t.z-P.z),k=st.count+S.proj;w.aim=base;
          for(let j=0;j<k;j++){const ang=base+(st.scythe?j*TAU/k:(j-(k-1)/2)*.5);
            projs.push({kind:'boom',x:w.wx,z:w.wz,a:ang,dist:0,range:st.range,phase:0,dmg:wDmg(w),size:st.size*Math.sqrt(S.area),spin:rnd(0,TAU),w,hit:new Set(),scy:st.scythe,life:9});}
          sfx('whoosh');}else w.cd=.05;}
        break;}
      case 'aura':{
        const R=st.radius*S.area;w.tickT-=dt;
        if(w.tickT<=0){w.tickT=st.tick/S.atkSpd;const dmg=wDmg(w);forNear(P.x,P.z,R+1.4,e=>{if(Math.hypot(e.x-P.x,e.z-P.z)<R+e.r){hurt(e,dmg,0,0,0,w,1);if(st.slow)e.slowT=.8;}});}
        const pu=1+Math.sin(G.t*4)*.03;w.aura.position.set(P.x,.07,P.z);w.aura.scale.setScalar(R*pu);w.auraRing.position.set(P.x,.09,P.z);w.auraRing.scale.setScalar(R*pu);
        break;}
      case 'chain':{
        if(w.cd<=0){let t=nearest(P.x,P.z,st.range);if(t){w.cd=wCd(w);w.aim=Math.atan2(t.x-P.x,t.z-P.z);let px=w.wx,pz=w.wz,k=st.jumps+1;const seen=new Set(),dmg=wDmg(w);
          while(t&&k-->0){seen.add(t.id);lightning(px,pz,t.x,t.z);px=t.x;pz=t.z;hurt(t,dmg,0,0,0,w);t=nearest(px,pz,st.jr,seen);}sfx('zap');}else w.cd=.05;}
        break;}
      case 'lob':{
        if(w.cd<=0){const c=within(P.x,P.z,st.range);if(c.length){w.cd=wCd(w);const k=st.count+S.proj;
          for(let j=0;j<k;j++){const t=pick(c);projs.push({kind:'lob',x:w.wx,z:w.wz,x0:w.wx,z0:w.wz,x1:t.x+rnd(-.6,.6),z1:t.z+rnd(-.6,.6),t:0,dur:.55,y:1.2,w,dmg:wDmg(w),radius:st.radius*S.area,pd:st.dur,life:9});}
          sfx('whoosh');}else w.cd=.1;}
        break;}
      case 'orbit':{
        w.ang+=st.speed*dt;const R=st.radius*Math.sqrt(S.area),dmg=wDmg(w),mesh=st.blade?bladeMesh:skullMesh;
        for(let j=0;j<st.count;j++){const oa=w.ang+j*TAU/st.count,ox=P.x+Math.sin(oa)*R,oz=P.z+Math.cos(oa)*R;
          if(mesh.count<40){dummy.position.set(ox,1.1,oz);dummy.rotation.set(0,st.blade?G.t*14+j:oa+Math.PI/2,0);dummy.scale.setScalar(st.size*(st.blade?1:.62));dummy.updateMatrix();mesh.setMatrixAt(mesh.count++,dummy.matrix);}
          forNear(ox,oz,st.size+1.4,e=>{const dx=e.x-ox,dz=e.z-oz,d=Math.hypot(dx,dz)||.001;if(d<e.r+st.size&&(e.oh[w.uid]||0)<=G.t){e.oh[w.uid]=G.t+st.hitCd;hurt(e,dmg,dx/d,dz/d,st.kb,w);}});}
        break;}
      case 'nova':{
        if(w.cd<=0){const R=st.radius*S.area,dmg=wDmg(w);let any=false;
          forNear(P.x,P.z,R+1.4,e=>{const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz)||.001;if(d<R+e.r){any=true;hurt(e,dmg,dx/d,dz/d,st.kb,w);if(st.stun)stun(e,st.stun);}});
          if(any){w.cd=wCd(w);ringFx(P.x,P.z,.6,R,.35,st.col);sfx('bell');G.shake=Math.max(G.shake,.15);}else w.cd=.15;}
        break;}
      case 'storm':{
        if(w.cd<=0){const c=within(P.x,P.z,st.range);if(c.length){w.cd=wCd(w);const R=st.radius*S.area,dmg=wDmg(w);
          for(let j=0;j<st.count;j++){const t=pick(c),tx=t.x,tz=t.z;skyBolt(tx,tz);ringFx(tx,tz,.3,R,.25,0x9fe8ff);forNear(tx,tz,R+1.4,e=>{if(Math.hypot(e.x-tx,e.z-tz)<R+e.r)hurt(e,dmg,0,0,0,w);});}
          sfx('zap');}else w.cd=.1;}
        break;}
    }
    // floating model
    const m=w.mesh;m.position.set(w.wx,1.15+Math.sin(G.t*3+i)*.08,w.wz);
    m.rotation.y+=angDiff(SPIN[w.def.type]?G.t*1.5:w.aim,m.rotation.y)*Math.min(1,dt*16);
    const kick=clamp((w.cd/Math.max(.2,wCd(w))),0,1);m.scale.setScalar((w.def.super?2:1.6)*(1+(w.st.cd>.3?kick*.25:0)));
  }
}
function updateProjs(dt){
  for(const p of projs){
    if(p.kind==='gun'){
      p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;
      forNear(p.x,p.z,p.r+1.3,e=>{if(p.life<=0||(p.hit&&p.hit.has(e.id)))return;const dx=e.x-p.x,dz=e.z-p.z;
        if(dx*dx+dz*dz<(e.r+p.r)*(e.r+p.r)){if(p.burn){e.burnT=3;e.burnDps=p.burn*S.dmg;e.burnW=p.w;}
          if(p.chill)e.slowT=Math.max(e.slowT,p.chill);if(p.stun)stun(e,p.stun);
          hurt(e,p.dmg,Math.sin(p.a),Math.cos(p.a),p.kb,p.w);burst(p.x,1.1,p.z,2,0xfff0c0,3,.1);
          if(p.pierce>0){p.pierce--;(p.hit||(p.hit=new Set())).add(e.id);}else p.life=0;}});
    }else if(p.kind==='homing'){
      p.life-=dt;p.seek-=dt;
      if(p.seek<=0||(p.target&&p.target.dead)){p.seek=.15;p.target=nearest(p.x,p.z,20,p.hit);}
      if(p.target){const want=Math.atan2(p.target.x-p.x,p.target.z-p.z);p.a+=clamp(angDiff(want,p.a),-p.turn*dt,p.turn*dt);}
      p.x+=Math.sin(p.a)*p.speed*dt;p.z+=Math.cos(p.a)*p.speed*dt;
      if(!p.knife&&parts.length<800&&Math.random()<.5)parts.push({x:p.x,y:1.1,z:p.z,vx:0,vy:1,vz:0,life:.25,max:.25,size:.14,r:1,g:.7,b:.3});
      let boom=false;
      forNear(p.x,p.z,1.7,e=>{if(boom||p.life<=0||(p.hit&&p.hit.has(e.id)))return;const dx=e.x-p.x,dz=e.z-p.z;
        if(dx*dx+dz*dz<(e.r+.35)*(e.r+.35)){
          if(p.radius)boom=true;
          else{hurt(e,p.dmg,Math.sin(p.a),Math.cos(p.a),p.kb,p.w);if(p.pierce>0){p.pierce--;(p.hit||(p.hit=new Set())).add(e.id);p.target=null;p.seek=0;}else p.life=0;}}});
      if(p.radius&&(boom||p.life<=0)){explode(p.x,p.z,p.radius,p.dmg,p.kb,p.w);p.life=0;}
    }else if(p.kind==='boom'){
      p.spin+=dt*16;
      if(p.phase===0){const sp=18;p.x+=Math.sin(p.a)*sp*dt;p.z+=Math.cos(p.a)*sp*dt;p.dist+=sp*dt;if(p.dist>=p.range){p.phase=1;p.hit.clear();}}
      else{const dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz)||.001;if(d<1.1)p.life=0;else{p.x+=dx/d*22*dt;p.z+=dz/d*22*dt;}}
      p.life-=dt;const rad=.6*p.size;
      forNear(p.x,p.z,rad+1.3,e=>{if(p.hit.has(e.id))return;const dx=e.x-p.x,dz=e.z-p.z,d=Math.hypot(dx,dz)||.001;if(d<e.r+rad){p.hit.add(e.id);hurt(e,p.dmg,dx/d,dz/d,3,p.w);}});
    }else if(p.kind==='lob'){
      p.t+=dt;const u=Math.min(1,p.t/p.dur);p.x=p.x0+(p.x1-p.x0)*u;p.z=p.z0+(p.z1-p.z0)*u;p.y=1.2+5*4*u*(1-u)-1.1*u;
      if(u>=1){p.life=0;const m=new THREE.Mesh(DISC_GEO,fxMat(0xff7a1a,.34,true));m.position.set(p.x1,.08,p.z1);m.scale.setScalar(p.radius);scene.add(m);
        puddles.push({x:p.x1,z:p.z1,r:p.radius,life:p.pd,tick:0,dmg:p.dmg,w:p.w,m});ringFx(p.x1,p.z1,.3,p.radius,.25,0xffb347);burst(p.x1,.4,p.z1,10,0xff8a2a,6,.18);sfx('fire');}
    }
  }
  projs=projs.filter(p=>p.life>0);
  for(const u of puddles){u.life-=dt;u.tick-=dt;u.m.material.opacity=Math.min(.34,u.life*.5)*(.85+Math.sin(G.t*18+u.x)*.15);
    if(u.tick<=0){u.tick=.4;forNear(u.x,u.z,u.r+1.4,e=>{if(Math.hypot(e.x-u.x,e.z-u.z)<u.r+e.r)hurt(e,u.dmg,0,0,0,u.w,1);});if(parts.length<700)burst(u.x+rnd(-u.r,u.r)*.6,.2,u.z+rnd(-u.r,u.r)*.6,1,0xffb347,1,.12);}
    if(u.life<=0){scene.remove(u.m);u.m.material.dispose();}}
  puddles=puddles.filter(u=>u.life>0);
  for(const p of eprojs){p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;if(Math.hypot(p.x-P.x,p.z-P.z)<.85){p.life=0;damagePlayer(p.dmg,'shot');}}
  eprojs=eprojs.filter(p=>p.life>0);
}

// ---------- enemies ----------
function spawnEnemy(type,o){
  o=o||{};const d=ETYPES[type],a=o.a===undefined?rnd(0,TAU):o.a,R=o.R||rnd(38,43),s=o.boss?3:o.elite?1.9:1;
  const hp=G.hpMul*(o.boss?4200:o.elite?420:d.hp);
  enemies.push({id:G.uid++,type,x:P.x+Math.sin(a)*R,z:P.z+Math.cos(a)*R,hp,maxHp:hp,
    spd:d.spd*(o.elite||o.boss?.92:rnd(.9,1.1))*(1+Math.min(.45,G.t/1000)),dmg:d.dmg*(o.boss?1.5:o.elite?1.4:1),
    r:d.r*s,mass:d.mass*s*s*(o.elite?2:1),s,elite:!!o.elite,boss:!!o.boss,xp:d.xp*(o.boss?150:o.elite?30:1),
    kx:0,kz:0,flash:0,atkCd:0,burnT:0,burnTick:0,burnDps:0,burnW:null,slowT:0,stunT:0,stunImm:0,shootCd:rnd(1,3),volley:3,yaw:0,ph:rnd(0,TAU),wp:rnd(0,TAU),oh:{},ranged:!!d.ranged,dead:false});
}
function rollType(){const t=G.t,r=Math.random();if(t>150&&r<.06&&enemies.filter(e=>e.type==='spitter').length<8)return'spitter';if(t>120&&r<.22)return'skeleton';if(t>90&&r<.3)return'brute';if(t>60&&r<.42)return'bat';if(t>35&&r<.64)return'wisp';return'zombie';}
function director(dt){
  const t=G.t;const late=Math.max(0,t-900)/60;   // after 15 minutes the night closes in: enemies compound every minute
  G.hpMul=(1+(t/60)*.38+Math.pow(t/230,2))*Math.pow(1.08,late);G.dmgMul=(1+t/420)*Math.pow(1.04,late);G.lateSpd=1+.02*late;
  if(t>=900&&!G.lateWarned){G.lateWarned=true;toast('Ночь сгущается: враги крепнут с каждой минутой','bad');sfx('warn');}
  const target=Math.min(16+t*.65,340),rate=1.1+t/28;
  G.spawnAcc+=rate*dt;while(G.spawnAcc>=1){G.spawnAcc--;if(enemies.length<target)spawnEnemy(rollType());}
  if(t>=G.nextWave){G.nextWave+=30;const n=Math.min(16+t/8,70),wr=Math.random(),ty=t>130&&wr<.3?'skeleton':t>70&&wr<.55?'bat':t>60&&wr<.75?'wisp':'zombie';
    if(Math.random()<.5){for(let i=0;i<n;i++)spawnEnemy(ty,{a:i/n*TAU,R:rnd(36,40)});toast('Кольцо нежити сжимается','bad');}
    else{const a0=rnd(0,TAU);for(let i=0;i<n;i++)spawnEnemy(ty,{a:a0+rnd(-.35,.35),R:rnd(36,46)});toast('Орда идёт','bad');}
    sfx('warn');}
  if(t>=G.nextElite){G.nextElite+=60;spawnEnemy(pick(['brute','zombie','brute']),{elite:1,R:34});toast('Элитный враг','bad');sfx('warn');}
  if(t>=G.nextBoss){G.nextBoss+=300;spawnEnemy('reaper',{boss:1,R:34});toast('ХОЗЯИН КЛАДБИЩА','big');sfx('warn');}
}
function updateEnemies(dt){
  const frozen=G.freeze>0;
  for(const e of enemies){
    if(e.flash>0)e.flash-=dt;e.atkCd-=dt;
    if(e.burnT>0){e.burnT-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=.5;hurt(e,e.burnDps*.5,0,0,0,e.burnW,1);if(e.dead)continue;}}
    let dx=P.x-e.x,dz=P.z-e.z;const d=Math.hypot(dx,dz)||.001;dx/=d;dz/=d;
    if(d>60&&!e.elite&&!e.boss){const a=rnd(0,TAU);e.x=P.x+Math.sin(a)*40;e.z=P.z+Math.cos(a)*40;continue;}
    let sp=e.spd*G.lateSpd;if(e.slowT>0){e.slowT-=dt;sp*=.6;}
    const stun=e.stunT>0;if(stun){e.stunT-=dt;sp=0;}if(frozen)sp=0;
    if(e.ranged&&!stun&&!frozen){
      if(d<7)sp*=-.6;else if(d<10.5)sp=0;
      e.shootCd-=dt;if(e.shootCd<=0&&d<17){e.shootCd=rnd(3.2,4.6);eprojs.push({x:e.x,z:e.z,vx:dx*8,vz:dz*8,life:3.4,dmg:e.dmg});}
    }
    let vx=dx*sp,vz=dz*sp;
    if(sp!==0){e.wp+=dt*e.spd*(e.type==='bat'?4:2.6);if(e.type==='bat'){const wv=Math.sin(G.t*3+e.ph)*2.4;vx-=dz*wv;vz+=dx*wv;}}
    if(e.boss&&!stun&&!frozen){e.volley-=dt;if(e.volley<=0&&d<28){e.volley=5;for(let q=0;q<10;q++){const va=q/10*TAU;eprojs.push({x:e.x,z:e.z,vx:Math.sin(va)*7,vz:Math.cos(va)*7,life:4,dmg:e.dmg*.4});}sfx('warn');}}
    e.x+=(vx+e.kx)*dt;e.z+=(vz+e.kz)*dt;const k=Math.min(1,dt*7);e.kx-=e.kx*k;e.kz-=e.kz*k;
    e.yaw=Math.atan2(dx,dz);
    if(d<e.r+.55&&e.atkCd<=0&&!stun&&!frozen){e.atkCd=.8;damagePlayer(e.dmg,e.boss?'boss':e.elite?'elite':e.type);}
  }
  buildGrid();
  // soft separation inside each grid cell so the horde does not collapse into one point
  grid.forEach(a=>{const n=a.length;if(n<2)return;for(let i=0;i<n;i++){const p=a[i];for(let j=i+1;j<n;j++){const q=a[j];let dx=q.x-p.x,dz=q.z-p.z;const min=(p.r+q.r)*.9,d2=dx*dx+dz*dz;
    if(d2<min*min){const d=Math.sqrt(d2)||.01,push=(min-d)*.5/d,mp=q.mass/(p.mass+q.mass),mq=1-mp;p.x-=dx*push*mp;p.z-=dz*push*mp;q.x+=dx*push*mq;q.z+=dz*push*mq;}}}});
}

// ---------- pickups ----------
function updateLoot(dt){
  const mag=S.magnet;
  for(const list of [souls,coins]){
    for(const s of list){
      const dx=P.x-s.x,dz=P.z-s.z,d=Math.hypot(dx,dz)||.001;
      if(!s.pull&&d<mag)s.pull=true;
      if(s.pull){const sp=Math.min(30,10+18/(d+.3));s.x+=dx/d*sp*dt;s.z+=dz/d*sp*dt;}
      else{s.x+=s.vx*dt;s.z+=s.vz*dt;const k=Math.min(1,dt*6);s.vx-=s.vx*k;s.vz-=s.vz*k;}
      if(d<.9){s.got=true;if(list===souls){G.combo++;sfx('soul');addXp(s.v);}else{G.coins+=s.v*S.coin;sfx('coin');}}
    }
  }
  souls=souls.filter(s=>!s.got);coins=coins.filter(s=>!s.got);
  for(const p of pickups){
    p.s.position.y=1.1+Math.sin(G.t*3+p.ph)*.18;
    if(Math.hypot(P.x-p.x,P.z-p.z)<1.5){p.got=true;scene.remove(p.s);p.s.material.dispose();sfx('pick');
      if(p.kind==='heal'){P.hp=Math.min(S.maxHp,P.hp+S.maxHp*.3);toast('Аптечка: +30% здоровья');}
      else if(p.kind==='magnet'){for(const s of souls)s.pull=true;for(const s of coins)s.pull=true;toast('Магнит: все души летят к вам');}
      else if(p.kind==='bomb'){sfx('bomb');screenFlash(.6);G.shake=.8;ringFx(P.x,P.z,1,30,.6,0xffe9a0);for(const e of within(P.x,P.z,30))hurt(e,e.elite||e.boss?e.maxHp*.2:e.hp+1,0,0,0,null,1);toast('Бомба!');}
      else if(p.kind==='rage'){G.rage=8;toast('Ярость: оружие бьёт быстрее');}
      else if(p.kind==='freeze'){G.freeze=4;toast('Заморозка');}
    }
  }
  pickups=pickups.filter(p=>!p.got);
  for(const c of chests){c.t+=dt;c.m.rotation.y=Math.sin(c.t*2)*.2;c.m.position.y=Math.abs(Math.sin(c.t*3))*.15;
    if(Math.hypot(P.x-c.x,P.z-c.z)<1.7){c.got=true;scene.remove(c.m);openChest();}}
  chests=chests.filter(c=>!c.got);
}
function fusionsReady(){const r=[];for(const id in WEAPONS){const d=WEAPONS[id];if(!d.super)continue;
  if(P.weapons.some(w=>w.id===d.from[0]&&w.lvl>=MAXL)&&P.weapons.some(w=>w.id===d.from[1]&&w.lvl>=MAXL))r.push(id);}return r;}
function unlockHero(id){if(save.unlocked[id])return;save.unlocked[id]=1;persist();G.newHeroes.push(id);toast('Открыт герой: '+HEROES[id].name,'big');sfx('chest');}
function checkUnlocks(){if(G.t>=300)unlockHero('gambler');if(P.lvl>=15)unlockHero('witch');if(G.fused>0)unlockHero('tinker');}
function doFuse(id){
  G.fused++;
  const d=WEAPONS[id];for(const f of d.from){const w=P.weapons.find(x=>x.id===f);if(w)removeWeapon(w);}
  addWeapon(id);recompute();hudBuild();toast('СЛИЯНИЕ: '+d.name,'big');sfx('fuse');screenFlash(.8);G.shake=.7;ringFx(P.x,P.z,1,16,.7,0xffd76a);burst(P.x,1.2,P.z,40,0xffd76a,10,.24);
}
function openChest(){
  sfx('chest');G.coins+=Math.round(rnd(5,10))*S.coin;burst(P.x,1.2,P.z,24,0xffd76a,8,.2);
  const fz=fusionsReady();if(fz.length){doFuse(fz[0]);return;}
  const ups=P.weapons.filter(w=>w.def.super||w.lvl<MAXL);
  if(ups.length){const pr=ups.filter(w=>!w.def.super&&P.weapons.some(o=>o.id===partnerOf(w.id)));const w=pick(pr.length?pr:ups);w.lvl++;calcW(w);recompute();hudBuild();toast(`Сундук: ${w.def.name} — уровень ${w.lvl}`,'big');}
  else{P.pas.dmg=(P.pas.dmg||0)+20;recompute();hudBuild();toast('Сундук: +20% урона','big');}
}

// ---------- level-up ----------
function rollCards(){
  const out=[],fz=fusionsReady();if(fz.length)out.push({kind:'fuse',id:fz[0]});
  const pool=[],owned=new Set(P.weapons.map(w=>w.id));
  for(const w of P.weapons){if(w.def.super)pool.push({kind:'up',id:w.id,wt:3});else if(w.lvl<MAXL)pool.push({kind:'up',id:w.id,wt:5});}
  if(P.weapons.length<S.slots)for(const id of BASE_IDS){if(owned.has(id)||owned.has(RECIPE[id]))continue;pool.push({kind:'new',id,wt:owned.has(partnerOf(id))?8:1.8});}
  for(const id in PASSIVES)pool.push({kind:'pas',id,wt:PASSIVES[id].wt||2.2});
  while(out.length<CARDS&&pool.length){
    let tot=0;for(const c of pool)tot+=c.wt;let r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=pool[i].wt;if(r<=0)break;}
    const c=pool.splice(i,1)[0];
    if(c.kind==='pas'){const d=PASSIVES[c.id];const q=Math.random();c.rar=d.fixed||(q<.08*S.luck?'epic':q<.32*S.luck?'rare':'common');const v=d.val*(d.fixed?1:RARITY[c.rar].mul);c.val=d.frac?Math.round(v*10)/10:Math.round(v);}
    out.push(c);
  }
  return out;
}
function cardHtml(c,i){
  const key=`<kbd class="key">${i+1}</kbd>`;
  const hint=id=>{const s=RECIPE[id];if(!s)return'';const pid=partnerOf(id),has=P.weapons.some(w=>w.id===pid);
    return `<div class="hint ${has?'hot':''}">Слияние: ${WEAPONS[id].name} + ${WEAPONS[pid].name} → ${WEAPONS[s].icon} ${WEAPONS[s].name}${has?' (вторая половина уже у вас)':''}. Нужен ${MAXL} уровень у обоих.</div>`;};
  const chips=d=>[...new Set(d.tags)].map(t=>`<span class="chip" style="--tc:${TAGS[t].color}">${TAGS[t].name}</span>`).join('');
  if(c.kind==='fuse'){const d=WEAPONS[c.id];return `<button class="card fuse" data-act="card" data-i="${i}">${key}<div class="kind">Слияние в супероружие</div><div class="top"><span class="ic">${d.icon}</span><span class="nm">${d.name}</span></div><div class="tx">${d.desc}</div><div class="hint hot">${WEAPONS[d.from[0]].name} + ${WEAPONS[d.from[1]].name} сливаются в одно оружие и освобождают ячейку.</div></button>`;}
  if(c.kind==='new'){const d=WEAPONS[c.id];return `<button class="card" style="--rc:${TAGS[d.tag].color}" data-act="card" data-i="${i}">${key}<div class="kind">Новое оружие</div><div class="top"><span class="ic">${d.icon}</span><span class="nm">${d.name}</span></div><div>${chips(d)}</div><div class="tx">${d.desc}</div>${hint(c.id)}</button>`;}
  if(c.kind==='up'){const w=P.weapons.find(x=>x.id===c.id),d=w.def;const tx=d.super?'+18% урона':d.ups[w.lvl-1][0];
    return `<button class="card" style="--rc:${d.super?'var(--gold)':TAGS[d.tags[0]].color}" data-act="card" data-i="${i}">${key}<div class="kind">Улучшение · уровень ${w.lvl} → ${w.lvl+1}</div><div class="top"><span class="ic">${d.icon}</span><span class="nm">${d.name}</span></div><div>${chips(d)}</div><div class="tx">${tx}</div>${d.super?'':hint(c.id)}</button>`;}
  const d=PASSIVES[c.id],r=RARITY[c.rar];
  return `<button class="card" style="--rc:${r.color}" data-act="card" data-i="${i}">${key}<div class="kind">Бонус · ${r.name}</div><div class="top"><span class="ic">${d.icon}</span><span class="nm">${d.name}</span></div><div class="tx">${d.txt(c.val)}</div><div class="hint">Складывается без предела.</div></button>`;
}
function renderLevelUp(){
  scr.hidden=false;
  scr.innerHTML=`<div class="wrap" style="max-width:720px"><div class="lvhead"><h1>Уровень ${P.lvl-G.pendingLv+1}</h1><p class="sub" style="margin-inline:auto">Выберите одну из двух карт.</p></div>
  <div class="cards">${G.cards.map(cardHtml).join('')}</div>
  <div class="row"><button class="btn" data-act="reroll" ${G.rerolls>0?'':'disabled'}>Реролл <kbd>R</kbd> · осталось ${G.rerolls}</button><button class="btn" data-act="skip">Пропустить и вылечить 15%</button></div></div>`;
}
function openLevelUp(){G.state='levelup';G.rerolls=S.rerolls;G.cards=rollCards();G.lock=performance.now()+350;sfx('level');renderLevelUp();}
function closeCard(){G.pendingLv--;recompute();hudBuild();if(G.pendingLv>0)openLevelUp();else{scr.hidden=true;G.state='play';}}
function pickCard(i){
  if(performance.now()<G.lock)return;const c=G.cards[i];if(!c)return;sfx('pick');
  if(c.kind==='fuse')doFuse(c.id);
  else if(c.kind==='new'){addWeapon(c.id);toast('Новое оружие: '+WEAPONS[c.id].name);}
  else if(c.kind==='up'){const w=P.weapons.find(x=>x.id===c.id);w.lvl++;calcW(w);}
  else{P.pas[c.id]=Math.round(((P.pas[c.id]||0)+c.val)*10)/10;if(c.id==='hp')P.hp+=c.val;}
  closeCard();
}
function reroll(){if(G.rerolls<=0||performance.now()<G.lock)return;G.rerolls--;G.cards=rollCards();sfx('pick');renderLevelUp();}
function skipCard(){if(performance.now()<G.lock)return;recompute();P.hp=Math.min(S.maxHp,P.hp+S.maxHp*.15);closeCard();}

// ---------- HUD ----------
const hudC={};
function setTxt(id,v){if(hudC[id]!==v){hudC[id]=v;$(id).textContent=v;}}
function hudBuild(){

    if(w)h+=`<div class="slot ${w.def.super?'super':''}" style="--tc:${TAGS[w.def.tags[0]].color}" title="${w.def.name}"><span class="ic">${w.def.icon}</span><span class="lv">${w.def.super?'★'+w.lvl:w.lvl>=MAXL?'макс':w.lvl}</span></div>`;

// ---------- update ----------
function update(dt){
  G.t+=dt;G.combo=Math.max(0,G.combo-dt*6);if(G.freeze>0)G.freeze-=dt;if(G.rage>0)G.rage-=dt;
  G.unlockT-=dt;if(G.unlockT<=0){G.unlockT=1;checkUnlocks();}
  // hero
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),mz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy){const l=Math.hypot(joy.dx,joy.dy);if(l>12){mx=joy.dx/l;mz=joy.dy/l;}}
  if(G.auto){mx=G.auto.x;mz=G.auto.z;}   // autopilot used by the balance runs
  const l=Math.hypot(mx,mz);if(l>0){mx/=l;mz/=l;P.dvx=mx;P.dvz=mz;}
  let sp=S.speed;if(P.dashT>0){P.dashT-=dt;sp*=3.4;mx=P.dvx;mz=P.dvz;if(parts.length<800)burst(P.x,.5,P.z,1,0x9fd0ff,1,.14);}
  P.x+=mx*sp*dt;P.z+=mz*sp*dt;P.moving=l>0||P.dashT>0;
  if(P.moving)P.yaw+=angDiff(Math.atan2(P.dvx,P.dvz),P.yaw)*Math.min(1,dt*14);
  P.dashCd-=dt;if(P.inv>0)P.inv-=dt;P.hp=Math.min(S.maxHp,P.hp+S.regen*dt);
  director(dt);updateEnemies(dt);
  skullMesh.count=0;bladeMesh.count=0;
  updateWeapons(dt);updateProjs(dt);updateLoot(dt);
  enemies=enemies.filter(e=>!e.dead);
  for(const p of parts){p.life-=dt;p.vy-=16*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.08){p.y=.08;p.vy*=-.4;p.vx*=.6;p.vz*=.6;}}
  parts=parts.filter(p=>p.life>0);
  for(const b of bolts)b.life-=dt;bolts=bolts.filter(b=>b.life>0);
  for(const n of nums)n.t+=dt;nums=nums.filter(n=>n.t<.7);
}
function updateFx(dt){
  for(const f of fxs){f.t+=dt;const u=Math.min(1,f.t/f.dur);f.m.scale.setScalar(f.r0+(f.r1-f.r0)*(1-(1-u)*(1-u)));f.m.material.opacity=f.op*(1-u);if(u>=1){scene.remove(f.m);f.m.material.dispose();}}
  fxs=fxs.filter(f=>f.t<f.dur);
  if(G.flash>0){G.flash=Math.max(0,G.flash-dt*2.5);$('#flash').style.opacity=G.flash.toFixed(2);}
}

function box(x,y,z,yaw,sx,sy,sz,r,g,b){if(bi>=BOXCAP)return;dummy.position.set(x,y,z);dummy.rotation.set(0,yaw,0);dummy.scale.set(sx,sy,sz);dummy.updateMatrix();boxes.setMatrixAt(bi,dummy.matrix);boxes.setColorAt(bi,col.setRGB(r,g,b));bi++;}
function sync(){
  const t=G.t;
  // enemies
  const cnt={},frozen=G.freeze>0;for(const k in ERIG)cnt[k]=0;
  for(const e of enemies){const rig=ERIG[e.type],i=cnt[e.type];if(i>=rig.cap)continue;cnt[e.type]=i+1;
    const still=frozen||e.stunT>0,sw=Math.sin(e.wp);
    const fy=e.type==='wisp'?.2+Math.sin(t*5+e.ph)*.16:e.type==='bat'?1.25+Math.sin(t*6+e.ph)*.25:Math.abs(sw)*.09*e.s;
    dummy.position.set(e.x,fy,e.z);dummy.rotation.set(0,e.yaw,sw*.07);const hs=e.flash>0?1.14:1;dummy.scale.set(e.s*hs,e.s*(e.flash>0?.9:1),e.s*hs);dummy.updateMatrix();
    if(e.flash>0)col.setRGB(3.2,3.2,3.2);else if(still)col.setRGB(.55,.9,1.7);else if(e.boss&&e.type!=='reaper')col.setRGB(1.6,.5,.55);else if(e.elite)col.setRGB(1.8,1.4,.5);else if(e.burnT>0)col.setRGB(1.6,.9,.55);else col.setRGB(1,1,1);
    for(const p of rig.parts){
      if(p.simple)p.mesh.setMatrixAt(i,dummy.matrix);
      else{const a=p.rest+Math.sin(e.wp+p.ph)*p.amp;if(p.axis==='z')_ml.makeRotationZ(a*p.mir);else _ml.makeRotationX(a);_ml.setPosition(p.px,p.py,p.pz);_mo.multiplyMatrices(dummy.matrix,_ml);p.mesh.setMatrixAt(i,_mo);}
      p.mesh.setColorAt(i,col);}
  }
  for(const k in ERIG)for(const p of ERIG[k].parts){p.mesh.count=cnt[k];p.mesh.instanceMatrix.needsUpdate=true;p.mesh.instanceColor.needsUpdate=true;}
  // glow boxes: bullets, bottles, enemy shots, sparks, lightning
  bi=0;let nb=0,ns=0;
  for(const p of projs){
    if(p.kind==='gun')box(p.x,1.1,p.z,p.a,p.wid,p.wid,p.len,p.cr,p.cg,p.cb);
    else if(p.kind==='lob')box(p.x,p.y,p.z,t*9,.3,.42,.3,.4,.9,.45);
    else if(p.kind==='homing'){if(p.knife)box(p.x,1.1,p.z,p.a,.1,.1,.8,p.cr,p.cg,p.cb);else{box(p.x,1.1,p.z,p.a,.22,.22,.7,.92,.94,.98);box(p.x-Math.sin(p.a)*.45,1.1,p.z-Math.cos(p.a)*.45,p.a,.16,.16,.3,1,.55,.15);}}
    else if(p.kind==='boom'){const mesh=p.scy?scytheMesh:boomMesh,i=p.scy?ns++:nb++;if(i<(p.scy?40:60)){dummy.position.set(p.x,1.1,p.z);dummy.rotation.set(0,p.spin,0);dummy.scale.setScalar(p.size*(p.scy?.75:1));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);}}
  }
  boomMesh.count=Math.min(nb,60);scytheMesh.count=Math.min(ns,40);boomMesh.instanceMatrix.needsUpdate=true;scytheMesh.instanceMatrix.needsUpdate=true;
  skullMesh.instanceMatrix.needsUpdate=true;bladeMesh.instanceMatrix.needsUpdate=true;
  // allies and gadgets: ghosts, turrets, mines, beams
  let ng=0,nt=0,nm=0;
  for(const w of P.weapons){const st=w.st;
    if(w.minions)for(const g of w.minions){if(ng>=16)break;dummy.position.set(g.x,.35+Math.sin(t*4+g.a)*.15,g.z);dummy.rotation.set(0,g.yaw,0);dummy.scale.setScalar(1.1);dummy.updateMatrix();ghostMesh.setMatrixAt(ng++,dummy.matrix);}
    if(w.turrets)for(const u of w.turrets){if(nt>=16)break;dummy.position.set(u.x,0,u.z);dummy.rotation.set(0,u.yaw,0);dummy.scale.setScalar(st.rocket?1.3:1);dummy.updateMatrix();turretMesh.setMatrixAt(nt++,dummy.matrix);}
    if(w.mines)for(const m of w.mines){if(nm>=40)break;dummy.position.set(m.x,0,m.z);dummy.rotation.set(0,0,0);dummy.scale.setScalar(1);dummy.updateMatrix();mineMesh.setMatrixAt(nm++,dummy.matrix);
      if(m.arm<=0&&Math.floor(t*4)%2===0)box(m.x,.32,m.z,0,.16,.16,.16,1,.2,.2);}
    if(w.def.type==='beam'){const L=st.len*Math.sqrt(S.area),c=rgb(st.col),fl=1+Math.sin(t*40)*.15;
      for(let j=0;j<st.count;j++){const ba=w.ang+j*TAU/st.count,bx=P.x+Math.sin(ba)*L/2,bz=P.z+Math.cos(ba)*L/2;
        box(bx,.95,bz,ba,st.wid*1.6*fl,.08,L,c[0],c[1],c[2]);box(bx,1,bz,ba,st.wid*.5,.12,L,1,1,1);}}
  }
  ghostMesh.count=ng;turretMesh.count=nt;mineMesh.count=nm;ghostMesh.instanceMatrix.needsUpdate=true;turretMesh.instanceMatrix.needsUpdate=true;mineMesh.instanceMatrix.needsUpdate=true;
  for(const p of eprojs)box(p.x,1.1,p.z,t*8,.42,.42,.42,1,.25,.3);
  for(const p of parts){const s=p.size*Math.min(1,p.life/p.max*2);box(p.x,p.y,p.z,p.life*9,s,s,s,p.r,p.g,p.b);}
  for(const b of bolts){const k=b.life/b.max;box(b.x,b.y,b.z,b.yaw,b.sx*k,b.sy*(b.sy>1?1:k),b.sz,b.r,b.g,b.b);}
  boxes.count=bi;boxes.instanceMatrix.needsUpdate=true;boxes.instanceColor.needsUpdate=true;
  // souls and coins
  let i=0;for(const s of souls){if(i>=1000)break;const big=s.v>=25?1.7:s.v>=5?1.25:1;dummy.position.set(s.x,.55+Math.sin(t*4+s.ph)*.12,s.z);dummy.rotation.set(0,t*3+s.ph,0);dummy.scale.set(big*.8,big*1.15,big*.8);dummy.updateMatrix();soulMesh.setMatrixAt(i,dummy.matrix);
    if(s.v>=25)col.setRGB(.85,.55,1);else if(s.v>=5)col.setRGB(.6,1,.5);else col.setRGB(.36,.95,.84);soulMesh.setColorAt(i,col);i++;}
  soulMesh.count=i;soulMesh.instanceMatrix.needsUpdate=true;soulMesh.instanceColor.needsUpdate=true;
  i=0;for(const s of coins){if(i>=300)break;dummy.position.set(s.x,.5+Math.sin(t*4+s.ph)*.1,s.z);dummy.rotation.set(0,t*4+s.ph,0);dummy.scale.setScalar(1);dummy.updateMatrix();coinMesh.setMatrixAt(i++,dummy.matrix);}
  coinMesh.count=i;coinMesh.instanceMatrix.needsUpdate=true;
  // hero
  const bob=P.moving?Math.abs(Math.sin(t*13))*.1:Math.sin(t*2)*.02;
  hero.position.set(P.x,bob,P.z);hero.rotation.y=P.yaw;hero.rotation.x=P.dashT>0?.5:P.moving?.14:0;
  for(const l of hero.userData.limbs)l.m.rotation.x=P.moving?Math.sin(t*13+l.ph)*l.amp:Math.sin(t*2+l.ph)*.05;
  hero.visible=!(P.inv>0&&G.state==='play'&&Math.floor(t*20)%2===0);
  syncProps();
  // camera and lights
  const sh=G.shake;const sx=sh>0?rnd(-1,1)*sh*.6:0,sz=sh>0?rnd(-1,1)*sh*.6:0;
  camera.position.set(P.x+sx,27*camK,P.z+19*camK+sz);camera.lookAt(P.x+sx,.6,P.z-1.2+sz);
  ground.position.set(P.x,0,P.z);groundTex.offset.set(P.x/TILE,-P.z/TILE);
  moon.position.set(P.x-16,34,P.z+12);moon.target.position.set(P.x,0,P.z);moon.target.updateMatrixWorld();
  lamp.position.set(P.x,2.6,P.z);lamp.intensity=1.5+Math.sin(t*9)*.08;
}
const pv=new THREE.Vector3();
function draw2d(){
  ctx.clearRect(0,0,W,H);if(G.state==='menu')return;
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const n of nums){pv.set(n.x,n.y+n.t*2.4,n.z).project(camera);const x=(pv.x+1)/2*W,y=(1-pv.y)/2*H,a=1-Math.max(0,(n.t-.4)/.3);
    const sz=n.crit?24:n.dot?13:16;ctx.font=`700 ${sz}px Rubik,Segoe UI,sans-serif`;ctx.globalAlpha=a;ctx.lineWidth=3;ctx.strokeStyle='rgba(8,9,16,.85)';ctx.strokeText(n.v,x,y);
    ctx.fillStyle=n.crit?'#ffd76a':n.dot?'#ff9c4a':'#fff';ctx.fillText(n.v,x,y);}
  ctx.globalAlpha=1;
  for(const e of enemies){if(!e.elite&&!e.boss)continue;pv.set(e.x,2.6*e.s,e.z).project(camera);const x=(pv.x+1)/2*W,y=(1-pv.y)/2*H,w=e.boss?120:64;
    ctx.fillStyle='rgba(8,9,16,.85)';ctx.fillRect(x-w/2-1,y-1,w+2,8);ctx.fillStyle=e.boss?'#ff5a5f':'#ffd76a';ctx.fillRect(x-w/2,y,w*clamp(e.hp/e.maxHp,0,1),6);}
  // chest direction marker when the chest is off-screen
  for(const c of chests){pv.set(c.x,1,c.z).project(camera);if(Math.abs(pv.x)<.95&&Math.abs(pv.y)<.9)continue;
    const a=Math.atan2(c.x-P.x,-(c.z-P.z)),x=W/2+Math.sin(a)*Math.min(W,H)*.38,y=H/2-Math.cos(a)*Math.min(W,H)*.38;
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ffd76a';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(11,10);ctx.lineTo(-11,10);ctx.closePath();ctx.fill();ctx.restore();}
  // touch stick under the finger
  if(joy&&G.state==='play'){ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.strokeStyle='#ece8dc';ctx.fillStyle='rgba(16,18,28,.35)';
    ctx.beginPath();ctx.arc(joy.x,joy.y,JOYR,0,TAU);ctx.fill();ctx.stroke();
    ctx.globalAlpha=.75;ctx.fillStyle='#5cf2d6';ctx.beginPath();ctx.arc(joy.x+joy.dx,joy.y+joy.dy,24,0,TAU);ctx.fill();ctx.globalAlpha=1;}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.state==='play'){update(dt);hudFrame();}
  if(G.state==='menu'){G.t+=dt;P.yaw=Math.sin(G.t*.5)*.6;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*2.2);
  updateFx(dt);sync();renderer.render(scene,camera);draw2d();
}
setHero(P.hero);makePortraits();recompute();showMenu();requestAnimationFrame(frame);
// small hooks for balancing from the console
window.NH={G,P,S,WEAPONS,HEROES,save,addXp,give:id=>{const w=addWeapon(id);recompute();hudBuild();return w;},max:()=>{for(const w of P.weapons){if(!w.def.super){w.lvl=MAXL;calcW(w);}}recompute();hudBuild();},skip:s=>{G.t+=s;},step:dt=>{if(G.state==='play'){update(dt);sync();}},start:startRun,spawnEnemy,
  // balance-run hooks: simulate without drawing, drive the hero, answer level-up cards
  tick:dt=>{if(G.state==='play')update(dt);},pick:i=>{G.lock=0;pickCard(i);},skipCard:()=>{G.lock=0;skipCard();},rerollCards:()=>{G.lock=0;reroll();},dash,
  setWeapons:(ids,lvl)=>{for(const w of P.weapons.slice())removeWeapon(w);for(const id of ids){const w=addWeapon(id);w.lvl=lvl||1;calcW(w);}recompute();hudBuild();},
  souls:()=>souls,coins:()=>coins,chests:()=>chests,pickups:()=>pickups,eprojs:()=>eprojs,fusionsReady,partnerOf,RECIPE,PASSIVES,META,metaCost,recompute,dropPickup,enemies:()=>enemies};
